[workspace]
resolver = "3"
members = ["boot/9boot", "kernel", "lib/acpi", "lib/bootinfo", "lib/elf", "lib/fbtext", "lib/ksyms", "lib/logring", "lib/uefi", "xtask"]
# Plan R crates build for their own targets via `cargo xtask`; a bare
# `cargo build` at the root builds only the host tool.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/planr"
publish = false

# Dependency rule (docs/adr/0001-core-alloc-only.md): no [workspace.dependencies]
# from registries or git. In-tree crates only. `cargo xtask deps` enforces it.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
debug = 1
