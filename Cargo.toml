[workspace]
resolver = "3"
members = ["boot/9boot", "cmd/boot", "cmd/cmds", "cmd/grep", "cmd/init", "cmd/ramfs", "cmd/rc", "cmd/utest", "kernel", "lib/9p", "lib/abi", "lib/acpi", "lib/bootarc", "lib/bootinfo", "lib/elf", "lib/fbtext", "lib/frames", "lib/heap", "lib/ksyms", "lib/logring", "lib/r", "lib/regexp", "lib/uefi", "xtask"]
# Plan R crates build for their own targets via `cargo xtask`; a bare
# `cargo build` at the root builds only the host tool.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/planr"
publish = false

# Dependency rule (docs/adr/0001-core-alloc-only.md): no [workspace.dependencies]
# from registries or git. In-tree crates only. `cargo xtask deps` enforces it.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
debug = 1

# User programs go into the boot archive: keep their symbols, not their
# debug info.
[profile.dev.package.utest]
strip = "debuginfo"
[profile.release.package.utest]
strip = "debuginfo"
[profile.dev.package.ramfs]
strip = "debuginfo"
[profile.release.package.ramfs]
strip = "debuginfo"
[profile.dev.package.rc]
strip = "debuginfo"
[profile.release.package.rc]
strip = "debuginfo"
[profile.dev.package.cmds]
strip = "debuginfo"
[profile.release.package.cmds]
strip = "debuginfo"
[profile.dev.package.grep]
strip = "debuginfo"
[profile.release.package.grep]
strip = "debuginfo"
